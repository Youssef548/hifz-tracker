name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  # Melos 3+ is a local install (declared in the root pubspec.yaml), but
  # `melos exec` shells out to a `melos` binary, so it also has to be activated
  # globally and its bin directory put on PATH.
  MELOS_VERSION: 6.3.3

jobs:
  js:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: hifz_test, POSTGRES_USER: hifz, POSTGRES_PASSWORD: hifz }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: "postgresql://hifz:hifz@localhost:5432/hifz_test"
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-32
      API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Must precede setup-node, whose `cache: pnpm` needs pnpm on PATH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm turbo run lint typecheck test build --affected

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub get
      - run: dart pub global activate melos ${{ env.MELOS_VERSION }}
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  drift:
    needs: [js, dart]
    runs-on: ubuntu-latest
    # Generating the spec boots the Nest app, so PrismaService.$connect() and
    # validateEnv() both need a reachable database and a real secret — the
    # migrations themselves are irrelevant here.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: hifz_test, POSTGRES_USER: hifz, POSTGRES_PASSWORD: hifz }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: "postgresql://hifz:hifz@localhost:5432/hifz_test"
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: pnpm install --frozen-lockfile
      # The spec compiles against contracts' built types and the generated
      # Prisma client, neither of which a bare install guarantees.
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter @hifz/contracts build
      - run: dart pub get
      - run: dart pub global activate melos ${{ env.MELOS_VERSION }}
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: ./scripts/gen-dart.sh && pnpm gen:quran
      - run: >
          git diff --exit-code dart-packages/ ||
          (echo "::error::generated dart files are stale — run pnpm gen:dart && pnpm gen:quran" && exit 1)
