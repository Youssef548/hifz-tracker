name: hifz_tracker
description: "Hifz Tracker — Arabic-first mobile app for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.0
  flutter_secure_storage: ^9.2.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  hifz_core:
    path: ../../dart-packages/core
  hifz_data:
    path: ../../dart-packages/data
  hifz_feature_auth:
    path: ../../dart-packages/features/auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
